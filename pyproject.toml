[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reclaim"
version = "0.4.0"
description = "Local-first file discovery, reconciliation, and migration planning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License pending operator approval before release" }
authors = [{ name = "RNC Solutions Group, Inc." }]
keywords = ["file-management", "deduplication", "migration", "inventory", "privacy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Filesystems",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.7,<6.10"]
evidence = [
  "pypdf>=6.0,<7",
  "pdfminer.six>=20240706",
  "python-docx>=1.1,<2",
  "python-pptx>=0.6.23,<2",
  "openpyxl>=3.1,<4",
  "olefile>=0.47,<1",
  "striprtf>=0.0.26,<1",
  "defusedxml>=0.7.1,<1",
]

[project.scripts]
reclaim = "reclaim.cli:main"

[project.gui-scripts]
reclaim-gui = "reclaim.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reclaim = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
